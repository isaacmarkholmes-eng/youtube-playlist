<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="referrer" content="origin">

  <title>Video Lounge</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <header class="yt-top-bar">

    <div class="yt-top-bar-inner">

      <a class="yt-brand" href="#" aria-label="Video Lounge home">

        <span class="yt-brand-icon" aria-hidden="true">▶</span>

        <span class="yt-brand-text">Video Lounge</span>

      </a>

      <div class="yt-search-wrap">

        <label class="yt-search">

          <span class="sr-only">Search videos</span>

          <input id="search-input" type="search" placeholder="Search" autocomplete="off">

        </label>

      </div>

    </div>

  </header>



  <main class="layout">

    <header class="site-header">

      <h1>Video Lounge</h1>

      <p id="subtitle" class="subtitle">Smart picks from your list</p>

    </header>



    <div class="watch-layout">

      <section class="player-card watch-primary">

        <div class="player-wrap">

          <iframe

            id="player"

            title="YouTube player"

            tabindex="-1"

            allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen"

            allowfullscreen

          ></iframe>

          <div class="player-shield player-shield-full" aria-hidden="true"></div>

          <div class="player-shield player-shield-top" aria-hidden="true"></div>

          <div class="player-shield player-shield-logo" aria-hidden="true"></div>

        </div>



        <div class="now-playing">
          <p class="label tv-only-label">Now playing</p>
          <h2 id="video-title">Loading…</h2>

          <div id="video-meta" class="meta now-playing-meta"></div>

          <p id="video-shuffle-note" class="shuffle-note"></p>

          <p id="video-tags" class="video-tags"></p>

        </div>



        <div class="controls">

          <button id="btn-pause" type="button">Pause</button>

          <button id="btn-random" type="button">Shuffle play</button>

          <button id="btn-next" type="button">Next</button>

          <button id="btn-theater" type="button" class="btn-secondary">Theater mode</button>

        </div>



        <div class="playback-prefs" aria-label="Playback preferences">

          <label class="pref-toggle">

            <input id="toggle-smart-shuffle" type="checkbox" checked>

            <span>Smart shuffle</span>

          </label>

          <label class="pref-toggle">

            <input id="toggle-hide-watched" type="checkbox">

            <span>Hide watched</span>

          </label>

          <button id="btn-clear-history" type="button" class="link-button">Clear watch history</button>

        </div>

      </section>



      <section class="queue-card watch-secondary">

        <div class="queue-header">

          <h3 id="browse-heading">Up next</h3>

          <button id="btn-reshuffle" type="button" class="link-button">Shuffle list</button>

        </div>



        <div id="channel-filters" class="channel-filters" aria-label="Filter by channel"></div>



        <div id="tag-filters" class="tag-filters" aria-label="Filter by tag"></div>

        <p id="dynamic-status" class="dynamic-status" hidden></p>

        <p id="results-count" class="results-count"></p>



        <div id="page-controls" class="page-controls" hidden>

          <button id="btn-page-prev" type="button">Previous page</button>

          <span id="page-label"></span>

          <button id="btn-page-next" type="button">Next page</button>

        </div>



        <div id="queue" class="queue queue--upnext" aria-label="Suggested videos"></div>

        <p id="empty-state" class="empty-state" hidden>No videos match your filters.</p>

      </section>

    </div>

  </main>



  <p id="error" class="error" hidden></p>



  <script>

    window.onerror = function (message) {

      var el = document.getElementById("error");

      if (!el) {

        return;

      }

      el.hidden = false;

      el.textContent = message;

    };

  </script>

  <script src="config.js"></script>

  <script src="videos.js"></script>

  <script src="channels.js"></script>

  <script src="channel-icons.js"></script>

  <script src="dynamic-videos.js"></script>

  <script src="app.js"></script>

</body>

</html>
