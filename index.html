<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Lounge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="layout">
    <header class="header">
      <h1>Video Lounge</h1>
      <p class="subtitle">Random picks from your list</p>
    </header>

    <section class="player-card">
      <div class="player-wrap">
        <iframe
          id="player"
          title="YouTube player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>

      <div class="now-playing">
        <p class="label">Now playing</p>
        <h2 id="video-title">Loading…</h2>
        <p id="video-meta" class="meta"></p>
        <p id="video-tags" class="video-tags"></p>
      </div>

      <div class="controls">
        <button id="btn-random" type="button">Another random</button>
        <button id="btn-next" type="button">Next in shuffle</button>
      </div>
    </section>

    <section class="queue-card">
      <div class="queue-header">
        <h3>Browse</h3>
        <button id="btn-reshuffle" type="button" class="link-button">Reshuffle results</button>
      </div>

      <div class="filters">
        <label class="search-field">
          <span class="sr-only">Search videos</span>
          <input id="search-input" type="search" placeholder="Search title, channel, or tags…" autocomplete="off">
        </label>

        <label class="channel-field">
          <span>Channel</span>
          <select id="channel-filter">
            <option value="all">All channels</option>
          </select>
        </label>
      </div>

      <div id="tag-filters" class="tag-filters" aria-label="Filter by tag"></div>
      <p id="dynamic-status" class="dynamic-status" hidden></p>
      <p id="results-count" class="results-count"></p>

      <div id="queue" class="queue" aria-label="Video browse grid"></div>
      <p id="empty-state" class="empty-state" hidden>No videos match your filters.</p>
    </section>
  </main>

  <p id="error" class="error" hidden></p>

  <script src="config.js"></script>
  <script src="videos.js"></script>
  <script src="channels.js"></script>
  <script src="dynamic-videos.js"></script>
  <script src="app.js"></script>
</body>
</html>
