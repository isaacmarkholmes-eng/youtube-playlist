<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Lounge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="layout">
    <header class="header">
      <h1>Video Lounge</h1>
      <p class="subtitle">Random picks from your list</p>
    </header>

    <section class="player-card">
      <div class="player-wrap">
        <iframe
          id="player"
          title="YouTube player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>

      <div class="now-playing">
        <p class="label">Now playing</p>
        <h2 id="video-title">Loading…</h2>
        <p id="video-meta" class="meta"></p>
      </div>

      <div class="controls">
        <button id="btn-random" type="button">Another random</button>
        <button id="btn-next" type="button">Next in shuffle</button>
      </div>
    </section>

    <section class="queue-card">
      <div class="queue-header">
        <h3>Up next</h3>
        <button id="btn-reshuffle" type="button" class="link-button">Reshuffle all</button>
      </div>
      <ol id="queue" class="queue"></ol>
    </section>
  </main>

  <p id="error" class="error" hidden></p>

  <script src="videos.js"></script>
  <script src="app.js"></script>
</body>
</html>
